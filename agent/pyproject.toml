[project]
name = "streamco-ask"
version = "0.1.0"
description = "StreamCo Ask agent: Genie Agent + fn_cancel_drivers + AI Search over knowledge_idx, one Unity Gateway model"
requires-python = ">=3.11"
dependencies = [
    "databricks-agentbricks[openai]>=0.8.0",
    "databricks-sdk>=0.124.0",
    "openai>=1.60",
    "mlflow-skinny>=3.4",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streamco_ask"]

[project.scripts]
start-server = "streamco_ask.server:main"
